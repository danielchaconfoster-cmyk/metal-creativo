<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo 2: Swiss Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px;
            height: 1080px;
            background: #060B14;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            position: relative;
            overflow: hidden;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* FONDO BLUEPRINT GRID */
        .swiss-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        .ambient-glow-cyan {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 500px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.14) 0%, transparent 70%);
            z-index: 2;
        }

        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HEADER SUIZO */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 20px;
        }

        .brand-swiss {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-swiss span {
            color: #38BDF8;
        }

        .tech-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #94A3B8;
            letter-spacing: 1px;
        }

        /* GRID PRINCIPAL */
        .grid-swiss {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 36px;
            align-items: center;
        }

        .kicker {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: #38BDF8;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .headline-swiss {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 100px;
            line-height: 0.88;
            letter-spacing: 1px;
        }

        .headline-swiss span {
            color: #38BDF8;
        }

        .tech-specs-box {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tech-tile {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 14px 16px;
            border-radius: 12px;
        }

        .tech-tile-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #38BDF8;
            margin-bottom: 4px;
        }

        .tech-tile-title {
            font-size: 15px;
            font-weight: 800;
            color: #F8FAFC;
        }

        /* FOTO DEL PRODUCTO GLASS FRAME */
        .photo-card {
            height: 480px;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 35%;
        }

        .photo-tag {
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(6, 11, 20, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #38BDF8;
            display: flex;
            justify-content: space-between;
        }

        /* FOOTER */
        .footer-swiss {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-swiss-val {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 80px;
            line-height: 0.9;
            color: #FFFFFF;
        }

        .btn-swiss-cta {
            background: #38BDF8;
            color: #060B14;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 900;
            font-size: 20px;
            padding: 20px 36px;
            border-radius: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(56, 189, 248, 0.35);
        }
    </style>
</head>
<body>
    <div class="swiss-bg"></div>
    <div class="ambient-glow-cyan"></div>

    <div class="content">
        <header class="header">
            <div class="brand-swiss">METAL <span>CREATIVO</span></div>
            <div class="tech-meta">NORMATIVA DS N° 55/2025 MTT • CHILE</div>
        </header>

        <main class="grid-swiss">
            <div>
                <span class="kicker">// ACOPLE METÁLICO RÍGIDO HOMOLOGADO</span>
                <h1 class="headline-swiss">BARRA RÍGIDA <br><span>DE REMOLQUE</span></h1>

                <div class="tech-specs-box">
                    <div class="tech-tile">
                        <div class="tech-tile-num">SPEC_01</div>
                        <div class="tech-tile-title">Ojales en Fragua</div>
                    </div>
                    <div class="tech-tile">
                        <div class="tech-tile-num">SPEC_02</div>
                        <div class="tech-tile-title">Soldadura TIG/MIG</div>
                    </div>
                    <div class="tech-tile">
                        <div class="tech-tile-num">SPEC_03</div>
                        <div class="tech-tile-title">Arrastre 3.500 KG</div>
                    </div>
                    <div class="tech-tile">
                        <div class="tech-tile-num">SPEC_04</div>
                        <div class="tech-tile-title">Huincha DOT-C2</div>
                    </div>
                </div>
            </div>

            <div class="photo-card">
                <img src="./public/images/lanza_real_uso_oficial.jpg" alt="Barra Lanza Real">
                <div class="photo-tag">
                    <span>PATENTE RC·CT·14</span>
                    <span>CHILE 2026</span>
                </div>
            </div>
        </main>

        <footer class="footer-swiss">
            <div>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #94A3B8; letter-spacing: 2px;">VALOR OFICIAL DIRECTO</span>
                <div class="price-swiss-val">$65.000 <span style="font-size: 22px; color: #38BDF8; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800;">CLP</span></div>
            </div>
            <div class="btn-swiss-cta">PEDIR POR WHATSAPP</div>
        </footer>
    </div>
</body>
</html>
