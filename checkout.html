    <!-- Fonts & CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root {
            --bg: #07080b;
            --bg-card: #11141a;
            --brand-orange: #ff6a00;
            --border-subtle: rgba(255, 255, 255, 0.08);

</head>
<body class="min-h-screen flex flex-col bg-[#07080b] antialiased">

    <!-- NAVBAR DE CHECKOUT -->
    <nav class="bg-[#050608] border-b border-white/10 py-4">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <img src="./images/logo_official.png" alt="Metal Creativo Chile" class="h-10 sm:h-12 w-auto object-contain">
            </a>
            <div class="flex items-center gap-3 text-xs text-gray-400">
                <span class="text-emerald-400 font-bold flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    Conexión Encriptada TLS 1.3
                </span>
                <span class="hidden sm:inline text-gray-600">•</span>
                <a href="index.html" class="hidden sm:inline hover:text-white transition-colors">Volver a la tienda</a>
            </div>
        </div>
    </nav>

    <header class="py-8 bg-gradient-to-b from-[#11141a] to-[#07080b] border-b border-white/10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 text-center space-y-2">
            <span class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-orange-500/20 text-orange-400 text-xs font-bold uppercase tracking-widest border border-orange-500/30">
                PASARELA DE PAGO SEGURA & FACTURACIÓN
            </span>
            <h1 class="text-2xl sm:text-4xl font-extrabold text-white tracking-tight">Checkout E-Commerce</h1>
            <p class="text-gray-400 text-xs sm:text-sm">Ingresa tus datos de despacho y selecciona tu método de pago preferido.</p>
        </div>
    </header>

    <main class="flex-grow py-10" x-data="{
        cart: JSON.parse(localStorage.getItem('mc_cart') || '[]'),
        nombre: '',
        rut: '',
        email: '',
        telefono: '',
        region: 'Región Metropolitana',
        comuna: '',
        direccion: '',
        depto: '',
        tipoDespacho: 'rm_express', // 'rm_express' o 'starken_por_pagar'
        paymentMethod: 'mercadopago', // mercadopago | transferencia | whatsapp
        processing: false,
        processStep: '',
        rutValido: true,

        get isRM() {
            return this.region === 'Región Metropolitana';
        },

        get subtotal() {
            return this.cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
        },

        get shippingCost() {
            if (this.isRM && this.tipoDespacho === 'rm_express') return 4990;
            return 0; // Envío por pagar en regiones o Starken
        },

        get grandTotal() {
            return this.subtotal + this.shippingCost;
        },

        formatPrice(val) {
            return new Intl.NumberFormat('es-CL').format(val);
        },

        onRegionChange() {
            // Regla de Negocio: Si sale de RM, Express Santiago queda deshabilitado
            if (!this.isRM) {
                this.tipoDespacho = 'starken_por_pagar';
            }
        },

        // Algoritmo Módulo 11 de validación de RUT chileno
        validarRUT(rutCompleto) {
            if (!rutCompleto || rutCompleto.trim().length < 7) return false;
            let valor = rutCompleto.replace(/\./g, '').replace(/-/g, '').trim().toUpperCase();
            if (valor.length < 8) return false;
            let cuerpo = valor.slice(0, -1);
            let dv = valor.slice(-1);
            if (!/^[0-9]+$/.test(cuerpo)) return false;
            let suma = 0;
            let multiplo = 2;
            for (let i = cuerpo.length - 1; i >= 0; i--) {
                suma += multiplo * parseInt(cuerpo.charAt(i), 10);
                multiplo = multiplo < 7 ? multiplo + 1 : 2;
            }
            let dvEsperado = 11 - (suma % 11);
            let dvFinal = dvEsperado === 11 ? '0' : dvEsperado === 10 ? 'K' : dvEsperado.toString();
            return dv === dvFinal;
        },

        formatearRUT() {
            let valor = this.rut.replace(/[^0-9kK]/g, '').toUpperCase();
            if (valor.length > 1) {
                let cuerpo = valor.slice(0, -1);
                let dv = valor.slice(-1);
                this.rut = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
            } else {
                this.rut = valor;
            }
            this.rutValido = this.validarRUT(this.rut);
        },

        get buttonText() {
            if (this.paymentMethod === 'mercadopago') return 'Pagar con Mercado Pago (Webpay / Tarjetas)';
            if (this.paymentMethod === 'transferencia') return 'Generar Orden y Ver Datos Bancarios';
            if (this.paymentMethod === 'whatsapp') return 'Confirmar y Enviar Pedido a WhatsApp';
            return 'Confirmar y Proceder al Pago';
        },

        async submitOrder() {
            if (this.cart.length === 0) {
                alert('Tu carrito está vacío. Agrega productos antes de continuar.');
                return;
            }
            if (!this.nombre || !this.rut || !this.email || !this.telefono || !this.direccion || !this.comuna) {
                alert('Por favor completa todos los campos requeridos para el despacho.');
                return;
            }
            if (!this.validarRUT(this.rut)) {
                alert('El RUT ingresado no es válido. Por favor verifica el dígito verificador.');
                return;
            }

            const orderId = 'MC-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
            const customerPayload = {
                full_name: this.nombre,
                rut: this.rut,
                email: this.email,
                phone: this.telefono,
                region: this.region,
                comuna: this.comuna,
                address_street: this.direccion,
                address_number: this.depto || 'S/N',
                address_extra: this.depto
            };

            const orderData = {
                orderId: orderId,
                date: new Date().toISOString(),
                customer: customerPayload,
                shipping: {
                    region: this.region,
                    comuna: this.comuna,
                    direccion: this.direccion,
                    metodo: this.tipoDespacho,
                    costo: this.shippingCost
                },
                items: this.cart,
                subtotal: this.subtotal,
                shippingCost: this.shippingCost,
                total: this.grandTotal,
                paymentMethod: this.paymentMethod
            };

            // 1. FLUJO DIRECTO A WHATSAPP
            if (this.paymentMethod === 'whatsapp') {
                localStorage.setItem('last_order', JSON.stringify(orderData));
                localStorage.removeItem('mc_cart');
                const resumenItems = this.cart.map(i => `${i.qty}x ${i.name}`).join(', ');
                const despachoTexto = this.isRM && this.tipoDespacho === 'rm_express' ? 'Express Santiago ($4.990)' : 'Starken Regional (Por Pagar)';
                const msg = encodeURIComponent(`Hola Metal Creativo! 🛠️\nQuiero coordinar la compra de mi orden:\n- Orden: #${orderId}\n- Productos: ${resumenItems}\n- Total: $${this.formatPrice(this.grandTotal)} CLP\n- Comprador: ${this.nombre} (RUT: ${this.rut})\n- Teléfono: ${this.telefono}\n- Despacho: ${this.direccion}, ${this.comuna} (${this.region})\n- Modalidad: ${despachoTexto}\n\nPor favor confirmar recepción para coordinar.`);
                window.location.href = `https://wa.me/56954922608?text=${msg}`;
                return;
            }

            // 2. FLUJO TRANSFERENCIA BANCARIA DIRECTA
            if (this.paymentMethod === 'transferencia') {
                this.processing = true;
                this.processStep = 'Registrando orden oficial de compra...';
                localStorage.setItem('last_order', JSON.stringify(orderData));
                localStorage.removeItem('mc_cart');
                setTimeout(() => {
                    window.location.href = `checkout-success.html?order=${orderId}&method=transferencia`;
                }, 600);
                return;
            }

            // 3. FLUJO MERCADO PAGO OFICIAL (CHECKOUT PRO)
            this.processing = true;
            this.processStep = 'Iniciando pasarela segura de Mercado Pago...';

            try {
                const response = await fetch('/api/create-preference', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer: customerPayload,
                        items: this.cart.map(i => ({ id: i.id, qty: i.qty })),
                        shipping_cost: this.shippingCost,
                        shipping_method: this.tipoDespacho
                    })
                });

                const result = await response.json();

                if (result.success && result.init_point) {
                    localStorage.setItem('last_order', JSON.stringify(orderData));
                    localStorage.removeItem('mc_cart');
                    this.processStep = 'Redirigiendo a pasarela bancaria...';
                    window.location.href = result.init_point;
                } else {
                    alert('Aviso Mercado Pago: ' + (result.error || 'No se pudo generar el enlace de pago. Por favor intenta de nuevo o selecciona Transferencia Bancaria.'));
                    this.processing = false;
                }
            } catch (err) {
                console.error('Error al conectar con pasarela:', err);
                alert('Hubo un problema de conexión al iniciar el pago. Puedes intentar nuevamente o coordinar por Transferencia / WhatsApp.');
                this.processing = false;
            }
        }
    }">
        <div class="max-w-6xl mx-auto px-4 sm:px-6">
            
            <!-- ALERTA DE CARRITO VACIO -->
            <template x-if="cart.length === 0">
                <div class="metal-card p-12 rounded-2xl text-center space-y-4 max-w-lg mx-auto">
                    <div class="w-16 h-16 rounded-full bg-orange-500/20 text-orange-400 mx-auto flex items-center justify-center text-2xl font-bold">
                        0
                    </div>
                    <h2 class="text-xl font-bold text-white">No tienes productos en tu carrito</h2>
                    <p class="text-xs text-gray-400">Selecciona una Barra Rígida de Remolque o Fogón a Bioetanol en nuestro catálogo para continuar.</p>
                    <a href="index.html#showcase" class="btn-metal-orange inline-block px-6 py-3 rounded-xl text-xs font-bold">Ver Catálogo Oficial</a>
                </div>
            </template>

            <!-- FORMULARIO DE CHECKOUT -->
            <template x-if="cart.length > 0">
                <form @submit.prevent="submitOrder()" class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                    
                    <!-- COLUMNA IZQUIERDA: FORMULARIOS -->
                    <div class="lg:col-span-7 space-y-6">
                        
                        <!-- 1. DATOS PERSONALES -->
                        <div class="metal-card p-6 rounded-2xl space-y-4">
                            <h3 class="text-base font-bold text-white flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-black flex items-center justify-center">1</span>
                                Datos del Comprador & Facturación
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                                <div>
                                    <label class="block font-bold text-gray-400 mb-1 uppercase">Nombre Completo *</label>
                                    <input type="text" x-model="nombre" required placeholder="Carlos Muñoz" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-400 mb-1 uppercase">RUT Chileno *</label>
                                    <input type="text" x-model="rut" @input="formatearRUT()" required placeholder="12.345.678-9" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border text-white focus:outline-none" :class="rut.length > 3 && !rutValido ? 'border-red-500 text-red-300' : 'border-white/10 focus:border-orange-500'">
                                    <span x-show="rut.length > 3 && !rutValido" class="text-[10px] text-red-400 mt-1 block">RUT inválido (Dígito verificador incorrecto)</span>
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-400 mb-1 uppercase">Correo Electrónico *</label>
                                    <input type="email" x-model="email" required placeholder="carlos@correo.cl" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                </div>
                                <div>
                                    <label class="block font-bold text-gray-400 mb-1 uppercase">Teléfono / WhatsApp *</label>
                                    <input type="tel" x-model="telefono" required placeholder="+56 9 8765 4321" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                </div>
                            </div>
                        </div>

                        <!-- 2. DATOS DE DESPACHO INTELIGENTE -->
                        <div class="metal-card p-6 rounded-2xl space-y-4">
                            <h3 class="text-base font-bold text-white flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-black flex items-center justify-center">2</span>
                                Dirección y Despacho a Todo Chile
                            </h3>
                            <div class="space-y-4 text-xs">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block font-bold text-gray-400 mb-1 uppercase">Región de Destino *</label>
                                        <select x-model="region" @change="onRegionChange()" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                            <option value="Región Metropolitana">Región Metropolitana de Santiago</option>
                                            <option value="Región de Valparaíso">Región de Valparaíso</option>
                                            <option value="Región del Biobío">Región del Biobío</option>
                                            <option value="Región de O'Higgins">Región de O'Higgins</option>
                                            <option value="Región del Maule">Región del Maule</option>
                                            <option value="Región de Coquimbo">Región de Coquimbo</option>
                                            <option value="Región de La Araucanía">Región de La Araucanía</option>
                                            <option value="Región de Los Lagos">Región de Los Lagos</option>
                                            <option value="Región de Antofagasta">Región de Antofagasta</option>
                                            <option value="Región de Los Ríos">Región de Los Ríos</option>
                                            <option value="Región de Ñuble">Región de Ñuble</option>
                                            <option value="Región de Tarapacá">Región de Tarapacá</option>
                                            <option value="Región de Atacama">Región de Atacama</option>
                                            <option value="Región de Arica y Parinacota">Región de Arica y Parinacota</option>
                                            <option value="Región de Aysén">Región de Aysén</option>
                                            <option value="Región de Magallanes">Región de Magallanes</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block font-bold text-gray-400 mb-1 uppercase">Comuna / Ciudad *</label>
                                        <input type="text" x-model="comuna" list="comunas-sugeridas" required placeholder="Ej: Providencia, Talca, Concepción" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                        <datalist id="comunas-sugeridas">
                                            <option value="Santiago Centro"></option>
                                            <option value="Providencia"></option>
                                            <option value="Las Condes"></option>
                                            <option value="Ñuñoa"></option>
                                            <option value="Maipú"></option>
                                            <option value="La Florida"></option>
                                            <option value="Puente Alto"></option>
                                            <option value="San Bernardo"></option>
                                            <option value="Quilicura"></option>
                                            <option value="Talca"></option>
                                            <option value="Curicó"></option>
                                            <option value="Rancagua"></option>
                                            <option value="Viña del Mar"></option>
                                            <option value="Valparaíso"></option>
                                            <option value="Concepción"></option>
                                            <option value="Temuco"></option>
                                            <option value="Puerto Montt"></option>
                                            <option value="Antofagasta"></option>
                                            <option value="La Serena"></option>
                                        </datalist>
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div class="sm:col-span-2">
                                        <label class="block font-bold text-gray-400 mb-1 uppercase">Calle y Número *</label>
                                        <input type="text" x-model="direccion" required placeholder="Av. Providencia 1234" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                    </div>
                                    <div>
                                        <label class="block font-bold text-gray-400 mb-1 uppercase">Depto / Casa / Ref</label>
                                        <input type="text" x-model="depto" placeholder="Depto 502" class="w-full px-3.5 py-2.5 rounded-lg bg-black/50 border border-white/10 text-white focus:outline-none focus:border-orange-500">
                                    </div>
                                </div>

                                <!-- MODALIDADES DE COURIER CON VALIDACION REGIONAL ESTRICTA -->
                                <div class="space-y-2 pt-2">
                                    <label class="block font-bold text-gray-400 uppercase">Modalidad de Transporte para tu Región:</label>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        
                                        <!-- OPCION 1: STARKEN REGIONAL / RM (SIEMPRE DISPONIBLE) -->
                                        <label class="p-3.5 rounded-xl border flex items-center gap-3 cursor-pointer transition-all" :class="tipoDespacho === 'starken_por_pagar' ? 'border-orange-500 bg-orange-500/10 text-white' : 'border-white/10 bg-neutral-900 text-gray-400'">
                                            <input type="radio" name="tipoDespacho" value="starken_por_pagar" x-model="tipoDespacho" class="accent-orange-500">
                                            <div>
                                                <strong class="block text-white">Starken / Chilexpress</strong>
                                                <span class="text-[11px] text-gray-300">Envío Por Pagar en Entrega / Agencia</span>
                                            </div>
                                        </label>

                                        <!-- OPCION 2: EXPRESS SANTIAGO (SOLO ACTIVO SI ES REGION METROPOLITANA) -->
                                        <template x-if="isRM">
                                            <label class="p-3.5 rounded-xl border flex items-center gap-3 cursor-pointer transition-all" :class="tipoDespacho === 'rm_express' ? 'border-orange-500 bg-orange-500/10 text-white' : 'border-white/10 bg-neutral-900 text-gray-400'">
                                                <input type="radio" name="tipoDespacho" value="rm_express" x-model="tipoDespacho" class="accent-orange-500">

                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- 3. METODO DE PAGO CON MERCADO PAGO OFICIAL -->

                                <span class="w-6 h-6 rounded-full bg-orange-500 text-white text-xs font-black flex items-center justify-center">3</span>
                                Método de Pago Seguro
                            </h3>

                            <div class="space-y-3">
                                <!-- MERCADO PAGO (CHECKOUT PRO) -->

                                            <strong class="text-white flex items-center gap-2">

                                            </strong>
                                            <span class="px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 text-[10px] font-bold">Inmediato</span>
                                        </div>
                                        <p class="text-[11px] text-gray-400">Paga en cuotas con tarjeta de crédito, tarjeta de débito Redcompra o dinero en cuenta.</p>
                                    </div>
                                </label>

                                <!-- TRANSFERENCIA DIRECTA -->

                                    <div class="flex-grow space-y-2">
                                        <div class="flex items-center justify-between">
                                            <strong class="text-white flex items-center gap-2">
                                                Transferencia Bancaria Electrónica
                                            </strong>
                                            <span class="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 text-[10px] font-bold">Datos al confirmar</span>
                                        </div>
                                        <p class="text-[11px] text-gray-400">Genera la orden y realiza la transferencia desde tu banco. Recibirás los datos bancarios y el número de pedido.</p>
                                    </div>
                                </label>

                                <!-- PEDIDO POR WHATSAPP -->
                                <label class="p-4 rounded-xl border flex items-start gap-3 cursor-pointer transition-all" :class="paymentMethod === 'whatsapp' ? 'border-orange-500 bg-orange-950/20 text-white' : 'border-white/10 bg-neutral-900 text-gray-400'">
                                    <input type="radio" name="paymentMethod" value="whatsapp" x-model="paymentMethod" class="accent-orange-500 mt-1">
                                    <div class="flex-grow">
                                        <strong class="text-white flex items-center gap-2">
                                            Confirmar y Coordinar vía WhatsApp
                                        </strong>
                                        <p class="text-[11px] text-gray-400">Genera la orden con un mensaje estructurado y coordina directamente con nuestro taller.</p>
                                    </div>
                                </label>
                            </div>
                        </div>

                    </div>

                    <!-- COLUMNA DERECHA: RESUMEN DE COMPRA -->
                    <div class="lg:col-span-5 space-y-6">
                        <div class="metal-card p-6 rounded-2xl space-y-4 sticky top-24">
                            <h3 class="text-base font-bold text-white flex items-center justify-between border-b border-white/10 pb-3">
                                <span>Resumen del Pedido</span>
                                <span class="text-xs text-orange-400 font-bold" x-text="cart.length + ' item(s)'"></span>
                            </h3>

                            <!-- LISTA DE PRODUCTOS -->
                            <div class="space-y-3 max-h-60 overflow-y-auto pr-1">
                                <template x-for="item in cart" :key="item.id">
                                    <div class="flex gap-3 items-center text-xs p-2 bg-black/40 rounded-lg border border-white/5">
                                        <img :src="item.image" :alt="item.name" class="w-12 h-12 object-cover rounded-md">
                                        <div class="flex-grow">
                                            <h5 class="text-white font-bold" x-text="item.name"></h5>
                                            <span class="text-gray-400" x-text="'Cant: ' + item.qty + ' x $' + formatPrice(item.price)"></span>
                                        </div>
                                        <span class="text-orange-400 font-bold" x-text="'$' + formatPrice(item.price * item.qty)"></span>
                                    </div>
                                </template>
                            </div>

                            <!-- TOTALES -->
                            <div class="pt-3 border-t border-white/10 space-y-2 text-xs">
                                <div class="flex justify-between text-gray-400">
                                    <span>Subtotal:</span>
                                    <span class="text-white font-bold" x-text="'$' + formatPrice(subtotal) + ' CLP'"></span>
                                </div>
                                <div class="flex justify-between text-gray-400">
                                    <span>Despacho:</span>
                                    <span class="text-white font-bold" x-text="isRM && tipoDespacho === 'rm_express' ? '$4.990 CLP' : 'Por Pagar (Starken)'"></span>
                                </div>
                                <div class="flex justify-between text-sm font-extrabold pt-2 border-t border-white/10">
                                    <span class="text-white">Total a Pagar:</span>
                                    <span class="text-orange-400 text-lg" x-text="'$' + formatPrice(grandTotal) + ' CLP'"></span>
                                </div>
                            </div>

                            <!-- BOTON DE ACCION CONTEXTUAL -->
                            <button type="submit" :disabled="processing" class="btn-metal-orange w-full py-4 rounded-xl font-black text-xs sm:text-sm uppercase tracking-wider cursor-pointer shadow-xl shadow-orange-500/30 flex items-center justify-center gap-2">
                                <span x-show="!processing" x-text="buttonText"></span>
                                <span x-show="processing" class="flex items-center gap-2">
                                    <span class="inline-block animate-spin w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span>
                                    <span x-text="processStep"></span>
                                </span>
                            </button>

                            <!-- SELLOS DE CONFIANZA -->
                            <div class="pt-2 text-center text-[10px] text-gray-500 space-y-1">
                                <p>Garantía Legal 6 Meses SERNAC Incluida</p>
                                <p>Despachos con seguimiento a todo Chile</p>
                            </div>
                        </div>
                    </div>

                </form>
            </template>

        </div>
    </main>

    <!-- FOOTER ULTRA LIMPIO -->
    <footer class="bg-[#050608] border-t border-white/10 pt-10 pb-6 text-xs text-gray-400 mt-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>&copy; 2026 Metal Creativo Chile. Todos los derechos reservados.</p>
            <div class="flex items-center gap-4 text-xs">
                <a href="terminos-condiciones.html" class="hover:text-orange-400">Términos</a>
                <a href="privacidad.html" class="hover:text-orange-400">Privacidad</a>
                <a href="devoluciones-garantia.html" class="hover:text-orange-400">Garantía 6 Meses</a>
            </div>
        </div>
    </footer>

</body>
